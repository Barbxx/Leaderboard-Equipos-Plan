<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa - Plan Cimos 2026</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: black; overflow: hidden;">

    <!-- BARRA SUPERIOR DE CONTROLES (Escenas) -->
    <div class="barra-controles-flotante">
        <div class="grupo-botones">
            <button id="btn-escena-logo" onclick="window.location.href='logo.html'">🖼️ Logo</button>
            <button id="btn-escena-video" onclick="window.location.href='video.html'">📺 Video Intro</button>
            <button id="btn-escena-mapa" onclick="window.location.href='mapa.html'" class="activo">🗺️ Mapa</button>
            <button id="btn-escena-leaderboard" onclick="window.location.href='index.html'">🏆 Posiciones</button>
        </div>
    </div>

    <!-- ESCENARIO PRINCIPAL -->
    <div id="escenario">

        <!-- Telón del Misterio -->
        <div id="telon" class="telon-oculto">
            <div class="telon-logo-pantalla">
                <img src="assets/logo.png" alt="Logo" class="telon-logo-img">
                <!-- Particulas decorativas -->
                <div class="telon-particula" style="--x:15%;--y:20%;--s:1.2;--d:0s"></div>
                <div class="telon-particula" style="--x:80%;--y:70%;--s:0.8;--d:1.5s"></div>
                <div class="telon-particula" style="--x:60%;--y:10%;--s:1;--d:0.8s"></div>
                <div class="telon-particula" style="--x:30%;--y:85%;--s:0.6;--d:2s"></div>
                <div class="telon-particula" style="--x:90%;--y:30%;--s:1.1;--d:0.3s"></div>
            </div>
        </div>

        <div id="escena-mapa" class="escena" style="background: black; position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
            <img src="assets/mapa.png" alt="Mapa" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
    </div>

    <script src="functions.js"></script>
</body>
</html>
