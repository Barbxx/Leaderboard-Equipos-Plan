<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo - Plan Cimos 2026</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: black; overflow: hidden;">

    <!-- BOTÓN FLOTANTE: Mostrar/Ocultar pestañas superiores -->
    <button id="btn-toggle-pestanas" class="btn-flotante" onclick="togglePestanas()" title="Mostrar / Ocultar pestañas" style="top: 15px; left: 15px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
        </svg>
    </button>

    <!-- BARRA SUPERIOR DE CONTROLES (Escenas) -->
    <div class="barra-controles-flotante">
        <div class="grupo-botones">
            <button id="btn-escena-logo" onclick="window.location.href='logo.html'" class="activo">🖼️ Logo</button>
            <button id="btn-escena-video" onclick="window.location.href='video.html'">📺 Video Intro</button>
            <button id="btn-escena-mapa" onclick="window.location.href='mapa.html'">🗺️ Mapa</button>
            <button id="btn-escena-leaderboard" onclick="window.location.href='index.html'">🏆 Posiciones</button>
        </div>
    </div>

    <!-- ESCENARIO PRINCIPAL -->
    <div id="escenario">

        <!-- Telón del Misterio -->
        <div id="telon" class="telon-oculto">
            <div class="telon-logo-pantalla">
                <img src="assets/logo.png" alt="Logo" class="telon-logo-img">
                <!-- Particulas decorativas -->
                <div class="telon-particula" style="--x:15%;--y:20%;--s:1.2;--d:0s"></div>
                <div class="telon-particula" style="--x:80%;--y:70%;--s:0.8;--d:1.5s"></div>
                <div class="telon-particula" style="--x:60%;--y:10%;--s:1;--d:0.8s"></div>
                <div class="telon-particula" style="--x:30%;--y:85%;--s:0.6;--d:2s"></div>
                <div class="telon-particula" style="--x:90%;--y:30%;--s:1.1;--d:0.3s"></div>
            </div>
        </div>

        <div class="telon-logo-pantalla" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
            <img src="assets/logo.png" alt="Logo" class="telon-logo-img">
            <!-- Particulas decorativas -->
            <div class="telon-particula" style="--x:25%;--y:10%;--s:1.2;--d:0s"></div>
            <div class="telon-particula" style="--x:70%;--y:80%;--s:0.8;--d:1.5s"></div>
            <div class="telon-particula" style="--x:50%;--y:20%;--s:1;--d:0.8s"></div>
            <div class="telon-particula" style="--x:15%;--y:70%;--s:0.6;--d:2s"></div>
            <div class="telon-particula" style="--x:85%;--y:40%;--s:1.1;--d:0.3s"></div>
        </div>
    </div>

    <script>
        function togglePestanas() {
            const barra = document.querySelector('.barra-controles-flotante');
            if (barra) {
                const oculta = barra.style.display === 'none';
                barra.style.display = oculta ? '' : 'none';
            }
        }
    </script>
</body>
</html>
